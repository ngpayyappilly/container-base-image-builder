# Console only: containers log to stdout/stderr and the platform ships it from there.
# (The stock file writes rotating files under $CATALINA_BASE/logs, impossible on a read-only fs.)
handlers = java.util.logging.ConsoleHandler
.handlers = java.util.logging.ConsoleHandler

.level = INFO
java.util.logging.ConsoleHandler.level = FINE
# One line per record: greppable, and one event == one log-pipeline entry
java.util.logging.ConsoleHandler.formatter = org.apache.juli.OneLineFormatter
java.util.logging.ConsoleHandler.encoding = UTF-8
