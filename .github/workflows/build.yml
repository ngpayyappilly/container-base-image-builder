name: base-images

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly rebuild: same pinned upstream digests, but harden.sh re-runs `apt-get upgrade`,
    # so Debian/Ubuntu security fixes reach consumers without waiting for a code change.
    - cron: "0 4 * * 1"
  workflow_dispatch:

# Least privilege by default; the publish job opts in to more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make lint

  verify:
    # One job per language; each builds, verifies, smoke-tests and scans ALL of its versions.
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lang: [go, java, python, node, tomcat]
    env:
      # Optional: anonymous Docker Hub pulls are rate limited (HTTP 429) on shared runners.
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: ${{ env.DOCKERHUB_USER != '' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      - run: make test ONLY=${{ matrix.lang }}   # build + version/hardening asserts + run every example
      - run: make scan ONLY=${{ matrix.lang }}

  publish:
    # PRs and branch dispatches (e.g. refresh-pins validation) only verify.
    # Only main (push, weekly schedule, manual dispatch from main) publishes.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lang: [go, java, python, node, tomcat]
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # keyless cosign signing (OIDC), no long-lived keys
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: ${{ env.DOCKERHUB_USER != '' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build every ${{ matrix.lang }} version multi-arch, attach SBOM + provenance, push
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_SERVER: ${{ github.server_url }}
          GH_REPO: ${{ github.repository }}
        run: |
          export REGISTRY="ghcr.io/${GH_OWNER,,}"
          export GIT_SHA="${GITHUB_SHA::12}"
          export BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export SOURCE_URL="${GH_SERVER}/${GH_REPO}"
          docker buildx bake -f docker-bake.hcl -f pins.hcl -f docker-bake.ci.hcl \
            --push --metadata-file meta.json ${{ matrix.lang }}

      - name: Sign every pushed image by digest (keyless)
        run: |
          jq -r 'to_entries[] | "\(.value["image.name"] | split(",")[0] | split(":")[0:-1] | join(":"))@\(.value["containerimage.digest"])"' meta.json |
          while read -r ref; do
            echo "signing $ref"
            cosign sign --yes "$ref"
          done
